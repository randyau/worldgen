# World Engine — Simulation Configuration
# Version: 0.2  (B2 purge — 2026-07-18)
#
# This file contains all simulation balance constants.
# Edit values here to tune behavior without recompiling.
# All values have comments explaining what they control.
#
# PROFILES: Create files in config/profiles/ that override specific sections.
# Profile files only need to include the values they override.
#
# RULE: If a number affects simulation behavior or balance, it lives here.
# Structural constants (save format version, enum values) stay in code.
#
# DEAD SECTIONS REMOVED (2026-07-18 — B2 config hygiene):
#   [characters], [utility], [goals], [environment], [civilization], top-level [resources],
#   [performance], legacy [events] keys, [events.population_impact_thresholds],
#   [world_gen.climate], [world_gen.ocean.min_ocean_8neighbors],
#   [sim_loop.speed] (keys moved to [sim_loop] with corrected names),
#   [sim_loop.persistence] (key moved to [sim_loop]).
# Future-intent sections moved to docs/config_future.md:
#   [admin_distance], [spatial_buffer], [specialists], [artifacts],
#   [cultural_modifiers], [civilization.settler_seeding].
# Runtime fertility keys from dead [resources] bound via [world_gen.resources].

# =============================================================================
# WORLD GENERATION
# =============================================================================

[world_gen]
default_tile_size_km    = 10      # Real-world km per world-scale tile
default_width_km        = 4000    # Default world width (Europe-scale)
default_height_km       = 3000    # Default world height (Europe-scale)
chunk_size              = 16      # Tile grid chunk dimensions (16×16 tiles per chunk)
magic_intensity_scale   = 1.0     # Multiplier on magic intensity peaks (V2 stub)

[world_gen.elevation]
noise_scale             = 0.3     # How much noise varies elevation around tectonic baseline
mountain_threshold      = 0.7     # Elevation above which terrain is classified as mountain
tectonic_intensity      = 0.8     # How dramatic plate collision effects are (0=gentle, 1=extreme)
smoothing_passes        = 3       # Box-blur passes on elevation after normalization.
                                   # Softens fault-line steps so rivers curve naturally. 0=off.

[world_gen.ocean]
default_sea_level       = 0.40    # Fraction of tiles (by elevation rank) that are ocean
erosion_passes          = 2       # Passes to strip thin ridges (≥min_ocean8_neighbors ocean 8-neighbors → ocean)
min_ocean8_neighbors    = 5       # Threshold for erosion: tiles with this many ocean 8-neighbors become ocean
                                   # 5 removes 1-tile-wide and 2-tile-wide protrusions; solid coasts are ≤4

[world_gen.resources]
# World-gen mineral density
iron_density            = 0.08    # Fraction of mountain/hill tiles with iron deposits
copper_density          = 0.04    # Fraction of volcanic-adjacent tiles with copper
tin_density             = 0.015   # Fraction of eligible tiles with tin (rare by design)
precious_metal_density  = 0.005   # Fraction of volcanic tiles with precious metals
rare_resource_density   = 0.003   # Fraction of tiles with rare/magical resources

# Runtime fertility dynamics (Phase 5) — previously in dead [resources] section
# DECISION: kept in [world_gen.resources] alongside density keys because ResourcesConfig
# is the binding type; the runtime/worldgen distinction is semantic, not structural.
fertility_recovery_per_year          = 3  # byte/year; recovery must be faster than penalty (ratio ~1:1)
post_fire_fertility_boost            = 30 # temporary fertility bonus (byte) after fire clears
drought_fertility_penalty_per_season = 3  # byte/season; balanced against recovery rate
drought_fertility_floor              = 5  # minimum fertility during drought (byte); prevents permanent zero

# =============================================================================
# SIMULATION LOOP
# =============================================================================

[sim_loop]
ticks_per_seasonal_change    = 4      # ticks between season changes (4 ticks/season × 4 seasons = 16 ticks/year)
auto_save_interval_ticks     = 960    # auto-save every N ticks (960 = ~60 in-game years at 16 ticks/year)
auto_save_dir                = "worldsave"  # directory for auto-saves and Ctrl+S saves
# Speed settings (moved from dead [sim_loop.speed] sub-table)
slow_ticks_per_second        = 0.5    # seasonal ticks per real second at Slow speed
normal_ticks_per_second      = 1.0    # seasonal ticks per real second at Normal speed
fast_ticks_per_second        = 10.0   # seasonal ticks per real second at Fast speed
ultrafast_snapshot_interval_ticks = 160  # push UI snapshot every N ticks in Ultrafast (160 = 10 years)
# Persistence (moved from dead [sim_loop.persistence] sub-table)
event_write_batch_interval_ticks = 20    # batch event writes every N ticks; ~1 year at Normal speed; 0=every tick
# Metrics: sample world health once per in-game year into yearly_metrics table (Phase A2)
metrics_enabled              = true   # false only for micro-benchmarks where DB writes must be minimized

# =============================================================================
# EVENTS AND HISTORY
# =============================================================================

[events]
# Active gate keys (consumed by EventsConfig / EventGate)
minimum_recorded_tier        = 0        # 0=Background, 1=Character, 2=Regional, 3=Headline
recent_event_cache_size      = 500
suppressed_types = ["SettlementGrew", "SettlementShrank", "Negotiated"]  # suppress per-tick noise; Negotiated floods DB before chars ally

[events.gate]
# Event types always recorded regardless of other gate settings
always_record_types = [
    "CharacterBorn",
    "CharacterDied",
    "CivilizationFounded",
    "CivilizationCollapsed",
    "ArtifactCreated",
    "ArtifactDestroyed",
    "ReligionFounded",
    "ReligionExtinct",
    "WarDeclared",
    "WarEnded",
    "TerritoryExpanded",
    "TerritoryLost",
    "SettlementConquered",
    "GodModeDisasterTriggered",
    "GodModeEntitySpawned",
    "GodModeCharacterCreated",
    "GodModeArtifactPlaced",
    "GodModeCivilizationForced",
    "CivSplintered",
]

# Event types always suppressed regardless of other gate settings
suppressed_types = [
    "Tier3ResourceTick",
    "SettlementFoodAccounting",
    "PopulationGrowthIncrement",
    "ArmySupplyConsumption",
    "RelationshipDecayTick",
    "CharacterMoved",          # pure locomotion: 77% of all events, zero narrative value
]

# =============================================================================
# WORLD GENERATION — TECTONICS
# =============================================================================

[world_gen.tectonics]
plate_count = 15
min_plate_separation_fraction = 0.12
continental_plate_fraction = 0.45
boundary_perturb_strength   = 10.0  # Tiles of max noise displacement at Voronoi assignment;
                                     # makes plate boundaries wavy. 0=straight, 8-12=organic.
boundary_perturb_frequency  = 0.07  # Noise frequency for perturbation. Lower=broader waves.

# =============================================================================
# WORLD GENERATION — RIVERS
# =============================================================================

[world_gen.rivers]
flow_accumulation_threshold = 50
min_lake_basin_tiles = 20
major_river_threshold = 500

# =============================================================================
# WORLD GENERATION — BIOME THRESHOLDS
# =============================================================================

[world_gen.biome_thresholds]
high_mountain_elevation = 220   # byte elevation above which terrain is HighMountain
mountain_elevation      = 180   # byte elevation above which terrain is Mountain
hills_elevation         = 140   # byte elevation above which terrain is Hills
hot_temperature         = 180   # byte temp above which tile is "hot" (tropical/desert zone)
cold_temperature        = 80    # byte temp below which tile is "cold" (boreal/tundra zone)
polar_temperature       = 40    # byte temp below which tile is "polar" (tundra/ice)
wet_moisture            = 160   # byte moisture above which tile is "wet" (forest/rainforest)
dry_moisture            = 60    # byte moisture below which tile is "dry" (savanna/desert)
arid_moisture           = 30    # byte moisture below which tile is "arid" (desert only)

# =============================================================================
# CLIMATE (runtime parameters for ClimateLayer + seasonal sim)
# =============================================================================

[climate]
storm_corridor_moisture_bonus     = 1.3    # Runtime: moisture multiplier inside storm corridor
monsoon_intensity_multiplier      = 1.5    # Runtime: moisture multiplier in monsoon season
tropical_band_half_width          = 0.25   # Fraction of world height defining tropical zone
rain_shadow_loss_fraction         = 0.6    # Moisture lost per tile immediately leeward of mountain
mountain_elevation_threshold      = 180    # Byte elevation above which rain shadow applies
monsoon_moisture_threshold        = 160    # Byte moisture above which tile is monsoon zone
storm_corridor_normalized_lat     = 0.35   # Fractional latitude of storm corridor center (0=S, 1=N)
storm_corridor_half_width         = 0.08   # Fraction of world height defining storm corridor band
storm_corridor_moisture_bonus_genesis = 0.3  # Moisture bonus multiplier during storm season

# Phase 5 additions — climate drift and sea level
annual_temp_drift_rate            = 0.05    # degrees per year; 0 = stable climate
max_warming_anomaly               = 5.0    # max GlobalTemperatureAnomaly (positive)
max_cooling_anomaly               = 3.0    # max GlobalTemperatureAnomaly magnitude (negative)
storm_corridor_shift_per_degree   = 0.005  # fractional lat shift per degree of anomaly
monsoon_anomaly_sensitivity       = 0.01   # MonsoonIntensityMultiplier change per degree of anomaly
monsoon_multiplier_min            = 0.5    # minimum MonsoonIntensityMultiplier
monsoon_multiplier_max            = 3.0    # maximum MonsoonIntensityMultiplier
lat_temperature_anomaly_scale     = 1.4    # amplification of temperature anomaly at high latitudes
annual_sea_level_drift_rate       = 0.0    # sea level change per year; 0 = stable
sea_level_event_threshold         = 0.1    # minimum delta to emit SeaLevelChanged event
volcanic_decay_rate               = 0.005  # VolcanicActivityMultiplier lerp toward 1.0 per tick (~0.07/year at 14 ticks/year)
moisture_carry_decay              = 0.993  # Fraction of moisture retained per inland tile during wind sweep
                                           # 0.97 (old) made interiors desert at ~50 tiles; 0.993 reaches ~70% at 50 tiles
temperature_noise_scale           = 0.28   # ±amplitude of coherent noise added to temperature latitude fraction.
                                           # Breaks horizontal biome banding. 0 = pure latitude bands. 0.22-0.30 = organic.
temperature_noise_frequency       = 0.009  # Noise frequency for temperature anomalies. ~111 tile period = broad regional blobs.
moisture_noise_scale              = 60.0   # ±amplitude (byte units 0-255) added to moisture after wind sweeps.
                                           # Breaks horizontal moisture banding (sweeps are row-by-row so all tiles at
                                           # same latitude get the same base moisture). 50-70 = strong regional variation.
moisture_noise_frequency          = 0.009  # Noise frequency for moisture anomalies. Matched to temp frequency for same blob size.
moisture_angle_blend              = 0.22   # Fraction of carry that bleeds to adjacent latitude rows at each column step.
                                           # 0 = pure horizontal sweep (bands strongly). 0.15-0.30 = angled, moisture crosses
                                           # latitude lines. Above 0.40 is unphysical. Works alongside moisture_noise_scale.
continental_radius_tiles          = 25.0  # E-folding distance (tiles) for maritime influence decay from ocean/lakes.
                                           # At this distance from water, maritime factor ≈ 37%; 2× distance ≈ 14%.
                                           # 20-30 tiles = realistic coast-to-interior transition for a 200-tile world.
continental_amplification         = 0.18  # Temperature deviation: coast cooled, interior warmed by this fraction × latDeviation.
                                           # Formula: (1 - 2*maritime) * amp * (latFrac - 0.5). Breaks 45° banding by making
                                           # same-latitude coasts temperate while interiors become desert. 0.10-0.22 = organic.
lake_moisture_recharge            = 0.40  # Moisture carry level that lake tiles raise the sweep to (0-1, fraction of max).
                                           # Lakes act as inland moisture sources; arid interiors with lakes stay wetter.
river_moisture_bonus              = 0.08  # Flat carry bonus added when sweep crosses a river tile. Stacks with existing carry.
continental_seasonal_threshold    = 0.25  # maritime influence below this → continental seasonal profile (wet summer, dry winter)
maritime_seasonal_threshold       = 0.50  # maritime influence above this → maritime profile (dry summer, wet autumn/winter)
min_seasonal_moisture_ratio       = 0.20  # seasonal CurrentMoisture floor: max(BaseMoisture + delta, BaseMoisture × this)
                                          # prevents winter/drought from zeroing moisture on low-BaseMoisture tiles

# =============================================================================
# DISASTERS (runtime, Phase 5)
# =============================================================================

[disasters]
wildfire_ignition_probability_per_tick = 0.000003  # 16 ticks/year × ~10k forest tiles → ~0.5/yr at this value
wildfire_ignition_dry_multiplier       = 3.0      # multiplier when moisture < dry threshold
wildfire_spread_probability_per_tick   = 0.10     # reduced from 0.20 — fires were spreading too aggressively
wildfire_max_ticks                     = 16
wildfire_dry_moisture_threshold        = 60
wildfire_hot_temperature_threshold     = 170      # effective temp above which heat multiplier kicks in
wildfire_ignition_hot_multiplier       = 2.0      # stacks with dry multiplier; hot+dry = 6× base probability
wildfire_intensity                     = 1.0      # 0-1 severity assigned to wildfire ActiveDisaster
flood_ignition_probability_per_tick    = 0.000002  # 16 ticks/year × eligible tiles → ~0.2/yr
flood_wet_moisture_threshold           = 200
flood_wet_multiplier                   = 2.0      # probability multiplier when tile is very wet
flood_spread_radius                    = 1        # tiles of radius from origin that get secondary flood
flood_origin_intensity                 = 0.7      # intensity at origin tile
flood_spread_intensity                 = 0.5      # intensity at spread tiles
flood_origin_ticks                     = 6        # duration (seasons) at origin
flood_spread_ticks                     = 4        # duration (seasons) at spread tiles
volcanic_eruption_probability_per_tick = 0.000005  # 16 ticks/year × volcanic tiles → ~0.2/yr
volcanic_ash_intensity                 = 1.0      # intensity assigned to VolcanicAsh ActiveDisaster
volcanic_activity_boost                = 0.05     # added to VolcanicActivityMultiplier per eruption
volcanic_activity_multiplier_cap       = 10.0     # VolcanicActivityMultiplier is clamped to this ceiling
earthquake_probability_per_tick        = 0.000005  # 16 ticks/year × ~4k fault tiles → ~0.3/yr
earthquake_intensity                   = 0.8      # intensity assigned to SeismicDamage ActiveDisaster
earthquake_decay_ticks                 = 8
drought_probability_per_year           = 0.05
drought_drought_multiplier             = 2.0      # chance multiplier when precipitation low
drought_precipitation_threshold        = 0.7
drought_min_seasons                    = 2
drought_max_seasons                    = 8

# =============================================================================
# BEASTS (lifecycle constants — species stats are in config/beasts.toml)
# =============================================================================

[beasts]
starvation_health_loss     = 5     # health points lost per season when FoodNeed < 0.2

# =============================================================================
# CHARACTER (Tier 1 — heroes, rulers — Phase 2.2+)
# =============================================================================

[character]
initial_count             = 14
max_age_seasons_min       = 80
max_age_seasons_max       = 200
max_health                = 100
needs_decay_safety        = 0.05
needs_decay_food          = 0.08
needs_decay_shelter       = 0.04
shelter_comfort_temp_low  = 80    # byte; tile BaseTemperature below this → cold shelter pressure
shelter_comfort_temp_high = 180   # byte; tile BaseTemperature above this → heat shelter pressure
shelter_temperature_scale = 0.8   # max additional decay multiplier at temp extremes (0→low or 255→high)
                                   # At scale=0.8: extreme cold/heat → 1.8× decay; settlement (+0.10) still net-positive
expansion_home_penalty    = 120   # tile score penalty applied to own-civ settlement tiles when character has Expansion goal (pushes them to leave)
expansion_empty_tile_bonus = 80   # tile score bonus for tiles outside every settlement's hinterland when Expansion goal is active
expansion_compactness_radius = 8  # max tile distance from a same-civ settlement that earns the compactness bonus
expansion_compactness_bonus  = 60 # bonus added when an unclaimed tile is near an existing same-civ settlement (encourages blob growth)
max_settlements_per_civ      = 15  # generous backstop; splinter mechanic (S2) is the real soft cap at ~3–7 cities
                                   # (was 5 — primary limiter, removed; S1 growth overhaul 2026-07-18)

# Colonization — separate long-range founding goal
colony_min_distance         = 10   # tiles from nearest same-civ settlement for a tile to be "frontier"
                                   # (was 25→15→10; S1 growth overhaul 2026-07-18)
global_settlement_min_dist  = 3    # minimum tiles from ANY existing settlement (any civ) — prevents clustering
                                   # (was 8→4→3; S4 verification: 4 was the primary growth binder — at 10 km/tile,
                                   # 30 km city spacing is historically reasonable; 2026-07-18)
colony_frontier_bonus       = 120  # tile score bonus for candidate tiles in frontier territory
colonize_ambition_threshold = 0.5  # min Ambition to form a Colonize goal (was 0.72 — too restrictive; S1 2026-07-18)
max_colonies_per_civ        = 5    # hard cap on live colonies (was 3; S1 growth overhaul 2026-07-18)
max_cities_per_civ          = 15   # total city cap per civ (was 8; soft backstop, splinter is real limiter; S1 2026-07-18)
city_founding_ambition_threshold = 0.3  # min Ambition for delegation (was 0.5 — blocked ~60% of chars; S1 2026-07-18)
shelter_seek_threshold    = 0.35  # below this shelter level, characters prefer terrain with natural cover when choosing where to move
shelter_seek_tile_bonus   = 80    # max tile-score bonus for a perfect-shelter biome (forest/mountain) when shelter-seeking
                                   # scales by desperation: bonus × BiomeShelterScore × (1 - shelter)
needs_decay_belonging     = 0.03
needs_decay_status        = 0.03
needs_decay_purpose       = 0.04
needs_decay_spiritual     = 0.02
# Settlement presence passively restores social/identity needs (per tick while on settlement tile)
belonging_own_settlement_recovery      = 0.03   # own-civ settlement: full community belonging (balances decay)
belonging_foreign_settlement_recovery  = 0.01   # foreign settlement: partial benefit as a stranger
status_own_settlement_recovery         = 0.03   # recognized by civ peers (balances decay)
purpose_own_settlement_recovery        = 0.02   # shared work and goals (rest makes up the rest)
spiritual_settlement_recovery          = 0.01   # any settlement: shared ritual, culture
needs_weight              = 0.5
goals_weight              = 0.3
personality_weight        = 0.2
softmax_temp_min          = 0.5
softmax_temp_max          = 2.0
perception_radius         = 3
health_per_season_heal    = 5
combat_damage_base        = 20
min_fertility_to_settle      = 17   # allow marginal land to be settled; only truly barren tiles excluded
                                   # (was 90→30→17; S4 verification: 30 stalled some geographies (seed 777);
                                   # 15 caused fragmentation churn; 17 balances all test seeds; 2026-07-18)
min_base_moisture_to_settle  = 15     # minimum BaseMoisture (0-255) required to found a settlement; prevents founding in climatically arid tiles
deposit_settle_threshold     = 0.5    # min deposit value to settle despite low fertility
deposit_score_multiplier     = 0.5    # how much deposit value boosts establish score
route_score_multiplier       = 0.3    # how much route-position bonus boosts establish score
# Ruins — founding score penalty for building on a destroyed or abandoned settlement site
ruin_cooldown_years           = 10    # hard block: cannot settle a ruined tile for this many years (deposit override disabled)
ruin_founding_penalty         = 0.4   # score penalty after cooldown expires (0–1); high deposits or fertility can still overcome it
ruin_decay_half_life_years    = 50    # years for the penalty to halve (exponential decay)

# Alliance system
alliance_max_base             = 2     # minimum alliance slots per character
alliance_max_per_sociability  = 3     # +floor(Sociability × this) extra slots; Soc=1.0 → 5 slots total
alliance_trust_floor          = 0.1   # trust below this dissolves the alliance on annual check
alliance_war_trust_drain      = 0.4   # trust drained from aggressor to target's allies on war declaration
enemy_of_ally_trust_drain     = 0.15  # trust drain on C when A allies B who is already allied with C's rival
ally_protect_goal_intensity   = 0.6   # priority of the Protect goal seeded on allies when their ally is attacked
ally_disaster_aid_intensity   = 0.3   # (reserved for future goal seeding; merchant routing handles aid currently)
max_war_duration_years        = 15     # wars end by truce after this many years if not ended sooner by surrender/destruction
max_active_wars               = 2     # hard cap: a civ cannot fight more than this many simultaneous wars
peace_cooldown_years          = 10    # years after a war ends before the same two civs can declare war again
war_exhaustion_years_per_war  = 5     # extra cooldown years per prior war between the same pair (1st=10yr, 2nd=15yr, 3rd=20yr...)
raid_damage_min               = 15    # minimum HP damage to a settlement per raid (was hardcoded 10)
raid_damage_max               = 40    # maximum HP damage to a settlement per raid (was hardcoded 30)
war_conquest_health_threshold = 35    # if target settlement health ≤ this at war expiry → conquest instead of truce
war_surrender_pop_threshold   = 5     # a civ with total population below this sues for peace (surrender)
# Rivalry cap scales with Aggression: max = floor(base + Aggression × per_aggression)
# Aggression=0 → 1 rival max; Aggression=1.0 → 4 rivals max
rivalry_max_base              = 1
rivalry_max_per_aggression    = 3
rivalry_trust_threshold       = -0.4  # trust must fall below this before DeclareRivalry is available; prevents one-encounter rivals
# Bond cap scales with Compassion: max = floor(base + Compassion × per_compassion)
# Compassion=0 → 1 bond max; Compassion=1.0 → 3 bonds max
bond_max_base                 = 1
bond_max_per_compassion       = 2

hinterland_drain_factor          = 0.5   # effective fertility multiplier inside same-civ hinterland (0.5 = half claimed)
base_founding_cooldown_years     = 2     # base cooldown between same-civ settlements; halves with population
                                         # (was 4; S1 growth overhaul 2026-07-18)
min_founding_cooldown_years      = 1     # floor — even large civs can't expand faster than once per year
                                         # (was 2; S1 growth overhaul 2026-07-18)
founding_cooldown_pop_scale      = 2000  # civ pop at which cooldown halves (4y→2y at 2k pop)
civ_birth_min_pop            = 20   # lowered from 30; settlements reach this faster with improved farming
civ_birth_chance_per_season = 0.01  # 1% per year at min-pop; keeps character count manageable for performance
# Territorial aggression: aggressive founders drain trust from foreign visitors on their settlement tile
territorial_aggression_min    = 0.55  # chars below this aggression don't apply pressure
territorial_trust_drain       = 0.025 # trust lost per tick; ~-0.1 in 1 season → rivalry within a year

# Beast encounters: predatory beasts on the same tile can attack wandering characters
beast_encounter_aggression_min = 0.3  # beasts below this aggression are passive toward characters
beast_encounter_chance         = 0.15 # probability of attack per shared tick (~every 7 ticks)
beast_damage_multiplier        = 0.3  # beast.Strength × this = damage dealt to character
char_counter_damage_multiplier = 0.4  # c.Skills.Combat × MaxHealth × this = counter-damage dealt to beast per exchange

# Character disease — named characters can catch disease from infected settlements
character_disease_exposure_chance  = 0.10  # annual probability of contracting disease while at an infected settlement
character_disease_health_drain     = 20    # HP drained per year while infected (suppresses natural healing)
character_disease_recovery_chance  = 0.30  # annual natural recovery probability (physician healing can supplement)

# Battle wounds — characters at a raided settlement fight back, and the raider can be wounded
defender_counter_damage_multiplier = 0.25  # defender.Combat × MaxHealth × this = damage dealt to raider
raider_char_damage_multiplier      = 0.20  # raider.Combat × MaxHealth × this = damage dealt to defending character

# Wildlife defense — characters present at a settlement during a wildlife raid are wounded and defend
wildlife_char_injury_fraction   = 0.12  # fraction of MaxHealth lost when a character is present at a wildlife raid
wildlife_char_defense_reduction = 0.40  # defender.Combat scales this; reduces population damage fraction (max reduction = this value)

# Wanderlust: travel urgency that builds the longer a character stays in one place
wanderlust_max_ticks            = 8    # full bonus after 2 seasons (half a year) stationary
wanderlust_bonus                = 0.4  # travel score bonus at max wanderlust; ~0.15 base → ~0.55 for free agents
# Role dampeners — multiply wanderlust_bonus; rulers barely wander, members occasionally, free agents fully
wanderlust_founder_multiplier   = 0.15 # settlement founders (kings, rulers) — 15% of base wanderlust
wanderlust_member_multiplier    = 0.8  # civ members — 70% of base wanderlust (was 0.5; raised to encourage expansion)
# Curiosity scales from this floor (Curiosity=0) up to 1.0 (Curiosity=1)
wanderlust_curiosity_floor      = 0.3  # even the least curious chars have 30% of their role's wanderlust
# Ancestry / cultural passive drains — applied per-tick when different-civ chars share a tile
personality_mismatch_drain_rate = 0.003  # drain × |stability diff| per tick
cultural_distance_drain_rate    = 0.002  # drain × cultural_distance (0–1) per tick
# Goal formation — personality trait thresholds below which a character won't form that goal type
goal_ambition_threshold      = 0.55  # minimum Ambition to generate Expansion goal
goal_aggression_threshold    = 0.6   # minimum Aggression to generate Dominance goal
goal_sociability_threshold   = 0.5   # minimum Sociability to generate Alliance goal
goal_compassion_threshold    = 0.5   # minimum Compassion to generate Bond goal
goal_ingenuity_threshold     = 0.55  # minimum Ingenuity to generate Create goal
goal_diligence_threshold     = 0.45  # minimum Diligence to generate BuildImprovement goal
avenge_aggression_threshold  = 0.6   # minimum Aggression to form Avenge goal on mourning
avenge_intensity_threshold   = 0.5   # minimum grief intensity required to form Avenge goal
bond_trust_threshold         = 0.5   # minimum relationship Trust before a character qualifies as Bond companion
goal_stale_season_limit      = 8     # seasons (2 years) without progress before a non-Grieve goal is pruned
rival_search_radius          = 5     # tile radius when scanning for nearby rivals (Dominance goal)
alliance_search_radius       = 4     # tile radius when scanning for nearby neutrals (Alliance goal)
bond_search_radius           = 3     # tile radius when scanning for Bond companions
war_aggression_threshold     = 0.5   # minimum Aggression to consider DeclareWar action

# Civilisation floor — prevents the world from converging to one or zero civs
# If active (non-collapsed) civ count drops below civ_floor_count, the annual pass
# rolls to spawn a new free-agent founder on unclaimed fertile land.
civ_floor_count        = 4     # minimum active civs; floor kicks in below this
civ_floor_spawn_chance = 0.3   # annual probability per missing civ slot to spawn a founder
civ_floor_min_dist     = 20    # minimum tile distance from existing settlements for the spawn tile
civ_floor_preferred_max_dist = 80  # S3: prefer floor-spawn sites within this distance of an existing
                                   # settlement (moderate spacing — new civs eventually meet neighbours);
                                   # falls back to any site when none qualify

# Biome spawn weights (S3) — multiplied into spawn-site selection for both initial
# character spawns (CharacterSpawner) and civ floor spawns (RunCivFloorSpawns).
# Down-weight harsh biomes (tundra/desert/mountain) so civs stop spawning where
# they struggle and leave ruins; favor grassland/plains/temperate/coast.
spawn_weight_tundra              = 0.05
spawn_weight_boreal_forest       = 0.4
spawn_weight_temperate_forest    = 1.0
spawn_weight_tropical_rainforest = 0.5
spawn_weight_grassland           = 1.5
spawn_weight_savanna             = 0.8
spawn_weight_desert              = 0.05
spawn_weight_swamp               = 0.3
spawn_weight_mountain            = 0.15
spawn_weight_hills               = 0.8
spawn_weight_plains              = 1.5
spawn_weight_beach               = 0.7
spawn_weight_default             = 0.3   # volcanic and anything unlisted

# Succession crisis — when the founding ruler dies, distant settlements enter instability
succession_crisis_years      = 10    # how long the crisis lasts after founder death
succession_crisis_decay_mult = 2.5   # decay rate multiplier for settlements beyond stable radius during crisis
succession_stable_radius     = 15    # tile radius from capital immune to succession instability

# Border tension — civ-level territorial pressure that triggers war without ruler proximity
war_proximity_radius        = 40    # tile radius within which settlements build tension toward each other
                                    # (was 15 — too small for 400×300 tile world; S1 growth overhaul 2026-07-18)
tension_accrual_per_pair    = 0.12  # tension added per close settlement pair per year (× proximity factor × ruler Aggression)
tension_decay_rate          = 0.15  # fraction of tension lost each year when no proximate settlements exist
tension_war_threshold       = 1.0   # accumulated tension at which war is declared (if ruler Aggression ≥ war_aggression_threshold)

# Wellbeing — emotional state dynamics (-1 spiraling … +1 flourishing)
wellbeing_goal_gain_rate        = 0.015   # per tick when a goal is progressing (raised from 0.01 — allows positive equilibrium)
wellbeing_companion_boost       = 0.005   # per tick co-located with Bond target
wellbeing_hunger_drain          = 0.02    # max drain at zero food
wellbeing_hunger_threshold      = 0.3     # food need below this triggers hunger wellbeing drain
wellbeing_mean_reversion_rate   = 0.008   # pull toward 0 each tick (raised from 0.005 — prevents permanent distress equilibrium)
flourishing_threshold           = 0.6     # Wellbeing ≥ this → Flourishing (lowered from 0.7 — more reachable)
spiral_threshold                = -0.7    # Wellbeing ≤ this → Spiraling
distressed_social_suppression   = 0.4     # social action score multiplier when Wellbeing < -0.3
grief_drain_rate                = 0.015   # Wellbeing drain per tick per Grieve goal
grief_decay_rate                = 0.004   # grief intensity decay per tick (raised from 0.002 — was ~31yr grief period, now ~15yr)
grief_wellbeing_shock           = 0.4     # fraction of grief intensity applied as immediate Wellbeing shock on mourning
grief_completion_threshold      = 0.05    # grief Intensity below this → grief goal auto-completes (grief resolved)
# Wellbeing drain multipliers for specific goal types (fraction of wellbeing_goal_gain_rate)
wellbeing_endure_multiplier     = 0.5     # Endure: slow draining perseverance
wellbeing_survive_multiplier    = 0.3     # Survive: urgent pressure but lower emotional weight
wellbeing_flee_multiplier       = 0.4     # Flee: flight-or-fight stress
# Stagnation: inactive goals drain wellbeing after this many ticks (note: TOML previously had wellbeing_ prefix; renamed to match C# property)
stagnation_threshold_ticks      = 80  # ticks before inactive goal drains wellbeing (~5 years at 16 ticks/year)
stagnation_drain_rate           = 0.002    # per tick for goals stuck without progress
purpose_drought_drain           = 0.003    # per tick when character has no flourishing goals (Create/Bond/FoundCity)

# Tier 2 sub-tuning (appended to [character] section — Tomlyn merges same-section keys)
# NOTE: tier2_* keys previously failed to bind due to digit→uppercase PascalToSnakeCase bug (fixed in B2).
# Dead-vs-live disagreements resolved: tier2_notable_cooldown_ticks TOML was 64, live was 32 → kept 32.
#                                       tier2_exceptional_work_chance TOML was 0.001, live was 0.002 → kept 0.002.
tier2_per_population        = 10
tier2_max_age_seasons_min   = 600   # ~38 years at 16 ticks/year (was 60 — 4 years, broken)
tier2_max_age_seasons_max   = 1200  # ~75 years (was 120 — also broken)
tier2_crystal_chance        = 0.001
tier2_needs_decay_food      = 0.06
tier2_needs_decay_safety    = 0.04
tier2_needs_decay_belonging = 0.03
tier2_needs_decay_status    = 0.04

# Scholar discovery settings
scholar_discovery_chance       = 0.04  # per-tick chance = this × Rationality
scholar_discovery_bonus_amount = 0.05  # bonus added to settlement ResourceStore key per discovery

# Physician settlement healing
physician_settlement_heal_rate = 0.5   # health restored per tick to infected settlement = this × Rationality

# Tier2 creator event pacing
# Most work happens silently; these control when it becomes a history-log event.
tier2_notable_cooldown_ticks  = 32     # minimum ticks between notable events per character (2 years; was 64 in dead TOML — live value 32 preserved)
