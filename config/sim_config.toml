# =============================================================================
# SETTLEMENT (Phase 2.4 — Population Dynamics)
# =============================================================================

[settlement]
settlement_start_pop        = 500   # founding group size (tribe/clan migrating with the leader); at 100 km²/tile this puts
                                    # tundra/desert founding at ratio ~0.4-0.5 (shortage — risky) while good farmland thrives
pop_growth_rate             = 0.5   # population added per season per fertility unit (fertility/255 × this)
                                    # Lower is intentional: fast growth causes Malthusian starvation with no surplus for stores
pop_decay_rate              = 0.05  # population lost per season unconditionally (hunger/disease baseline)
starvation_decay_rate       = 0.3   # extra decay per unit food deficit when food < shortage_threshold
famine_decay_rate           = 0.8   # extra decay per unit food deficit when food < crisis_threshold
pop_min_viable              = 5     # below this → settlement abandoned
pop_max                     = 50000 # hard cap; tiles = 100 km² each; 50k is a large early-medieval city + hinterland (early-medieval Paris ~30k)
fertility_variance          = 0.15  # per-settlement founding-time multiplier range (±this around 1.0)

# Population ceiling — food-ledger derived (D1 unification).
# Carrying capacity is now computed directly from the food model:
#   capacity = sum over territory tiles of (PeoplePerTilePeak × fertility × moisture × growing_season × biome_mult)
# Biome differentiation lives in BiomeFoodMultiplier (ResourcePressurePhase). No separate per-biome
# table is needed. The old carry_cap_grassland … carry_cap_default keys have been removed.
carry_cap_minimum         = 100   # floor: newly-founded settlement with tiny territory never hits zero instantly
# EMA smoothing alpha for the derived capacity. Damps territory-population feedback oscillation.
# 0 = frozen (never updates), 1 = raw each tick. At 0.05: half-life ~13 ticks (≈0.8 years).
capacity_smoothing_alpha  = 0.05

# Disease outbreaks — structural model (D4): base × density_factor × contact_factor × famine_factor
# Risk concentrates in dense cities, war-engaged civs, and famine-stricken settlements.
disease_base_chance          = 0.01   # ~1 outbreak per 150 years per average settlement (was 0.02 — too frequent)
disease_density_mult         = 3.0    # large dense cities still vulnerable: ~4× at pop/cap=1.0
# Contact factor: civ has active emissary contact (EmissaryExchange+) or is at war → disease travels on roads and campaigns
disease_contact_mult         = 1.5    # 50% extra risk when civ has trade/war contact with another civ
# Famine factor: FoodPressureRatio < famine_threshold → immune suppression doubles outbreak risk
disease_famine_mult          = 2.0    # 2× outbreak risk while in food crisis
disease_famine_threshold     = 0.70   # FoodPressureRatio below which famine factor fires (matches crisis threshold)
disease_mortality_per_year   = 0.05   # meaningful but not instantly lethal
disease_min_pop              = 30     # outbreaks cannot start below this population
disease_spread_radius        = 12     # tile radius within which disease can spread annually
disease_spread_chance        = 0.08   # reduced from 0.20 — disease is regional, not instantly global
disease_max_duration_years   = 8      # infection auto-clears after this many years
disease_recovery_chance      = 0.30   # natural recovery probability per year

# Settlement health recovery — passive repair between raids
# At 1 HP/tick and 16 ticks/year, a fully destroyed settlement (0 HP) recovers to 100 in ~6 years.
health_recovery_per_tick = 1    # HP regained per tick; raids deal 10–30 HP so recovery takes weeks to months
max_health               = 100  # maximum settlement health

# Wildlife raids — annual attacks scaled by biome danger and settlement size
# Open biomes (plains, savanna, desert) have lower risk; dense cover (forest, jungle, swamp) is higher.
# See BiomeWildlifeRisk() in PopulationDynamicsPhase.cs for per-biome multipliers.
wildlife_attack_base_chance  = 0.05   # reduced from 0.08; biome multiplier then adjusts (0.3x–2.0x)
wildlife_attack_damage       = 0.08   # reduced from 0.10
wildlife_defense_pop_scale   = 300    # settlements at this population have 80% reduced vulnerability

# Emigration — pressure-driven colonization triggered when settlements exceed carrying capacity
emigration_threshold         = 0.75   # fraction of carrying cap above which emigration activates
emigration_bonus_chance      = 0.08   # additional annual spawn probability when over threshold (scaled by pressure)
emigrant_pop_cost            = 20     # population deducted from parent settlement per emigrant spawned

crystal_pop_artisan         = 200
crystal_pop_scholar         = 300
crystal_pop_physician       = 500
crystal_pop_merchant        = 1000

# Population milestone events — single-tick thresholds for SettlementGrew / SettlementShrank
# 20% growth in one tick captures founding-burst conditions (e.g. immigration surge)
# 15% shrink in one tick captures famine, severe raids, and disease spikes
growth_event_threshold_pct  = 0.05   # 5% growth vs start-of-tick pop; fires on annual tick only
shrink_event_threshold_pct  = 0.05   # 5% decline; catches disease/disaster hits each year

[resource_pressure]
shortage_threshold      = 0.6    # food ratio below this = shortage; seeds Acquire goals
crisis_threshold        = 0.3    # food ratio below this = crisis; also seeds Flee goals
acquire_goal_intensity  = 0.7
flee_goal_intensity     = 0.5
strain_event_cooldown   = 8      # ticks between SettlementStraining events per settlement
# Single scale factor for world population. Tiles = 10km × 10km = 100 km² each.
# Early medieval farmland: ~5-10 people/km² → 500-1000 per good tile.
# All biomes scale from this via fertility × moisture × growing season × biome factor.
people_per_tile_peak    = 50.0   # D1 recalibration: target food ratio 2-5 by year 300 so drought/disaster can push below 1.0.
                                 # At 50/tile and 13 starting tiles: founding territory supports ~370 people (ratio 0.74 at start_pop 500) — food-constrained from day 1.
                                 # World population scales proportionally; tune this knob to set world-population scale (--audit-food shows per-tile contributions).
                                 # Old value of 500 kept food ratio at 36-58; at 50 food becomes a real constraint within the first century.
food_moisture_floor          = 0.25   # proportional floor: fraction of BaseMoisture always available (wells, root storage, irrigation)
food_moisture_absolute_floor = 0.35   # absolute floor applied after proportional; ensures low-BaseMoisture tiles still produce food from groundwater/rivers rather than zeroing out in drought
# Growing-season temperature factor (multiplies food contribution per hinterland tile)
# Cold-hardy floor below frost, then ramp to 1.0 at optimal_low → flat 1.0 to optimal_high → ramp to heat_stress_factor at 255
frost_temperature_threshold = 45   # effective temp (byte) below which the cold-hardy floor applies
cold_hardy_food_floor       = 0.70 # food fraction available below frost threshold (herding, fishing, cold-adapted crops); 0.70 gives tundra ~14-tile viability at initial territory
optimal_temperature_low     = 100  # lower bound of peak growing band; below this food scales up from 0
optimal_temperature_high    = 200  # upper bound of peak growing band; above this heat stress begins
heat_stress_factor          = 0.7  # multiplier at extreme heat (255); tropical-desert crops still viable but stressed

# Resource stores — settlements accumulate persistent reserves for all resources
# Vital resources (food, water) draw from stores during shortages; wealth/stockpile resources just accumulate.
biome_food_bonus_scale             = 1.0    # 0=all biomes equal, 1.0=full biome differentiation (grassland 2x, desert 0.3x)
store_accumulate_rate              = 0.4     # D1 recalibration: fraction of per-tick surplus that goes into stores (was 0.6; reduced so stores drain more in drought)
store_max_seasons_per_k_pop        = 2.0    # max vital store depth in seasons per 1000 population (was 4.0; reduced to let drought deplete stores faster)
store_min_seasons                  = 1.0    # hard floor on vital store capacity; small settlements buffer 1 season (was 2.0; reduced so drought can push ratio below 1.0)
# Per-resource spoilage rates (fraction lost per tick regardless of draws)
food_spoilage_rate                 = 0.002  # ~500 ticks (35y) to fully spoil if never drawn
water_spoilage_rate                = 0.010  # cisterns evaporate faster; settlements need continuous rainfall
wealth_spoilage_rate               = 0.0001 # gold/gems essentially permanent
stockpile_spoilage_rate            = 0.0005 # iron/copper/timber decay slowly
wealth_accumulate_rate             = 0.2    # fraction of non-vital ledger supply that banks into stores per tick
store_raid_destruction_per_damage  = 0.008  # fraction of ALL stores destroyed per point of raid damage (granaries/vaults burn)

