# World Engine — Religion Archetype Definitions
# Each [[religion]] block defines one archetype a founding character can produce.
# When a character founds a religion (M15 15.0), the archetype whose affinity_* biases best match
# the founder's PersonalityVector (weighted dot product) is selected; a deity name and name
# template are then rolled from its pools to produce the religion's display name.

# =============================================================================
# COMPASSION — mercy, protection of the weak, communal care
# =============================================================================
[[religion]]
id            = "compassion_cult"
zealotry      = -0.6
display_name  = "Cult of Compassion"
affinity_compassion = 0.6
affinity_aggression  = -0.3
deity_names = [
  "Aelanthe", "Serenya", "Mirelis", "Thendra", "Calenna", "Veshara",
  "Ondrel", "Isolwen", "Farenna", "Brindolis"
]
tenets = [
  "mercy over conquest",
  "the weak and the wounded are sacred",
  "no debt of suffering goes unanswered",
  "a shared table is a holy table",
]
name_templates = [
  "The Circle of {deity}",
  "Faith of {deity}",
  "The {deity}an Communion",
  "The Mercy of {deity}",
]

